<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spinning wheel</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="controls">
        <button id="Prize" >Prize Mode</button>
        <input type="number" id="amount" min="2" placeholder="Amount">
        <button id="createWheel">Create Wheel</button>
    </div>
    <span class="arrow"></span>
    <div class="container" id="wheel">
        <img src="/img/Untitled design (1).png" alt="the Prize wheel">
    </div>
    <button id="spin">Spin</button>

    <script src="index.js"></script>
</body>
</html>
